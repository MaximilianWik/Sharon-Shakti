<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#0a0a0a"/>
  <g fill="none" stroke="#9a1620" stroke-linecap="round">
    <!-- outer ring -->
    <circle cx="100" cy="100" r="92" stroke-width="3.5"/>
